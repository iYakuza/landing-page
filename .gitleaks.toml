# Gitleaks default rules stay enabled.
# A public browser identifier remains only in the retired analytics.js file's
# immutable commit history. This file is not part of the live website.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Retired analytics source retained only in Git history; its public identifier is not used by the live website."
  paths = ['''(^|/)analytics\.js$''']

  [[rules.allowlists]]
  description = "This is a browser localStorage namespace, not a credential."
  condition = "AND"
  regexTarget = "line"
  paths = ['''(^|/)game-ui\.js$''']
  regexes = ['''constellationPositionKey''']
