name: One-time full-history secret audit

on:
  push:
    branches:
      - audit/full-history-secret-scan-20261113

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    name: Scan all branches, pull-request refs, tags and Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch every public branch, tag and pull-request head
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/origin/pr/*'
          echo "Branches: $(git for-each-ref --format='%(refname)' refs/remotes/origin/ | wc -l)"
          echo "Tags: $(git for-each-ref --format='%(refname)' refs/tags/ | wc -l)"
          echo "Reachable commits: $(git rev-list --all --count)"

      - name: Download and verify pinned Gitleaks release
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" \
            -o "$RUNNER_TEMP/gitleaks_checksums.txt"
          grep -E "[[:space:]]gitleaks_${VERSION}_linux_x64.tar.gz$" "$RUNNER_TEMP/gitleaks_checksums.txt" > "$RUNNER_TEMP/gitleaks_checksum.txt"
          test -s "$RUNNER_TEMP/gitleaks_checksum.txt"
          EXPECTED_SHA="$(awk '{print $1}' "$RUNNER_TEMP/gitleaks_checksum.txt")"
          printf "%s  %s\\n" "$EXPECTED_SHA" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Scan every commit reachable from every fetched ref
        id: history
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git \
            --config .gitleaks.toml \
            --redact=100 \
            --report-format=json \
            --report-path="$RUNNER_TEMP/history-findings.json" \
            --log-opts="--all --full-history" \
            "$GITHUB_WORKSPACE"
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo "::error::Gitleaks history scan failed with exit code $result"
            exit "$result"
          fi
          python3 - "$RUNNER_TEMP/history-findings.json" <<'PY'
          import json, sys
          findings = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"Historical findings: {len(findings)}")
          for item in findings:
              print("HISTORY", json.dumps({
                  "rule": item.get("RuleID"),
                  "file": item.get("File"),
                  "line": item.get("StartLine"),
                  "commit": item.get("Commit"),
                  "author": item.get("Author"),
                  "date": item.get("Date"),
                  "fingerprint": item.get("Fingerprint"),
              }, ensure_ascii=True))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"## Historical scan\n\nFindings: **{len(findings)}**\n\n")
              for item in findings:
                  out.write(f"- `{item.get('RuleID')}` — `{item.get('File')}`:{item.get('StartLine')} — commit `{item.get('Commit')}`\n")
          PY

      - name: Scan current tracked working-tree files
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir \
            --config .gitleaks.toml \
            --redact=100 \
            --report-format=json \
            --report-path="$RUNNER_TEMP/current-findings.json" \
            "$GITHUB_WORKSPACE"
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            echo "::error::Gitleaks directory scan failed with exit code $result"
            exit "$result"
          fi
          python3 - "$RUNNER_TEMP/current-findings.json" <<'PY'
          import json, sys
          findings = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"Current-tree findings: {len(findings)}")
          for item in findings:
              print("CURRENT", json.dumps({
                  "rule": item.get("RuleID"),
                  "file": item.get("File"),
                  "line": item.get("StartLine"),
                  "fingerprint": item.get("Fingerprint"),
              }, ensure_ascii=True))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"\n## Current-tree scan\n\nFindings: **{len(findings)}**\n")
          PY

      - name: Review local references and unreferenced code candidates
        run: python3 scripts/audit_repo_hygiene.py
