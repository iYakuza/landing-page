name: Publish visitor-friendly changelog

on:
  push:
    branches: [main]
    paths:
      # Public pages and browser code.
      - "*.html"
      - "**/*.html"
      - "*.js"
      - "**/*.js"
      - "*.css"
      - "**/*.css"
      - "*.json"
      - "**/*.json"
      - "*.xml"
      - "**/*.xml"
      - "*.txt"
      - "**/*.txt"
      - "*.svg"
      - "**/*.svg"
      - "*.ico"
      - "**/*.ico"
      - "*.webmanifest"
      - "**/*.webmanifest"
      - "CNAME"
      - ".nojekyll"
      - ".well-known/**"
      - "assets/**"
      - "media/**"
      - "content/**"
      # Internal-only changes do not need a public-site deployment.
      - "!tests/**"
      - "!docs/**"
      - "!scripts/**"
      - "!.github/**"
      # A Pages workflow change must also deploy, even without a changelog entry.
      - ".github/workflows/deploy-pages.yml"
      - "!google-apps-script/**"

permissions:
  contents: write

# The newest push processes the whole uncheckpointed commit range.
# Replacing stale queued/running summaries avoids redundant feed jobs.
concurrency:
  group: visitor-changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Summarize project changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Build and publish the visitor-facing changelog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          # Another commit may reach main while this job is running. Rebuild
          # from the latest main and retry instead of rebasing changelog.json.
          for attempt in 1 2 3 4 5; do
            echo "Changelog publish attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main

            python3 scripts/generate_changelog.py "$GITHUB_EVENT_PATH" changelog.json

            if git diff --quiet -- changelog.json; then
              echo "No visitor-facing changes to publish."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add changelog.json
            git commit -m "Publish visitor-friendly changelog"

            if git push origin HEAD:main; then
              echo "Visitor-facing changelog published successfully."
              exit 0
            fi

            echo "main changed during publication; fetching the latest version and retrying."
            sleep 2
          done

          echo "Unable to publish changelog after 5 attempts."
          exit 1
