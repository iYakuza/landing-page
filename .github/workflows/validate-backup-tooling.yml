name: Validate backup tooling

on:
  push:
    branches:
      - "backup/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/google-drive-backup.yml"
      - ".github/workflows/validate-backup-tooling.yml"
      - "scripts/backup_storage.py"
      - "scripts/upload_drive_backup.py"
      - "scripts/create_backup_manifest.py"
      - "scripts/verify_backup_manifest.py"
      - "supabase/functions/google-drive-oauth-callback/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile Python backup tools
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/backup_storage.py \
            scripts/upload_drive_backup.py \
            scripts/create_backup_manifest.py \
            scripts/verify_backup_manifest.py \
            scripts/export_edge_env_inventory.py \
            scripts/verify_storage_export.py \
            scripts/generate_restore_sql.py

      - name: Test backup manifest generation and verification
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          mkdir -p "$TEST_DIR/database"
          printf 'schema test\n' > "$TEST_DIR/database/schema.sql"
          printf 'data test\n' > "$TEST_DIR/database/data.sql"
          python3 scripts/create_backup_manifest.py "$TEST_DIR"
          python3 scripts/verify_backup_manifest.py "$TEST_DIR"
          printf 'tamper\n' >> "$TEST_DIR/database/data.sql"
          if python3 scripts/verify_backup_manifest.py "$TEST_DIR"; then
            echo "::error::Manifest verifier did not detect modified content"
            exit 1
          fi

      - name: Test Auth and Vault restore SQL generation
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          mkdir -p "$TEST_DIR/auth" "$TEST_DIR/secrets"
          printf '[{"id":"00000000-0000-0000-0000-000000000001","email":"owner@example.invalid"}]' > "$TEST_DIR/auth/users.json"
          printf '[{"id":"00000000-0000-0000-0000-000000000002","user_id":"00000000-0000-0000-0000-000000000001","provider":"email"}]' > "$TEST_DIR/auth/identities.json"
          printf '[{"name":"test_secret","description":"test description","secret":"dummy-secret"}]' > "$TEST_DIR/secrets/vault-secrets.json"
          python3 scripts/generate_restore_sql.py --root "$TEST_DIR"
          grep -q 'jsonb_populate_recordset(null::auth.users' "$TEST_DIR/restore/auth-restore.sql"
          grep -q "vault.create_secret('dummy-secret', 'test_secret'" "$TEST_DIR/restore/vault-restore.sql"

      - name: Validate YAML and Supabase TOML syntax
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true); puts "YAML OK: #{f}" }' \
            .github/workflows/google-drive-backup.yml \
            .github/workflows/validate-backup-tooling.yml
          python3 -c 'import tomllib; tomllib.load(open("supabase/config.toml", "rb")); print("Supabase TOML OK")'

      - name: Check OAuth callback TypeScript formatting and types
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/google-drive-oauth-callback/index.ts
