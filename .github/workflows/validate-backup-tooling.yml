name: Validate backup tooling

on:
  push:
    branches:
      - "backup/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/google-drive-backup.yml"
      - ".github/workflows/validate-backup-tooling.yml"
      - "scripts/backup_storage.py"
      - "scripts/upload_drive_backup.py"
      - "scripts/create_backup_manifest.py"
      - "scripts/verify_backup_manifest.py"
      - "scripts/**"
      - "supabase/functions/google-drive-oauth-callback/**"
      - "supabase/config.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install the pinned Supabase CLI version
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Confirm Supabase CLI version
        run: supabase --version

      - name: Compile Python backup tools
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/backup_storage.py \
            scripts/upload_drive_backup.py \
            scripts/create_backup_manifest.py \
            scripts/verify_backup_manifest.py \
            scripts/export_edge_env_inventory.py \
            scripts/verify_storage_export.py \
            scripts/generate_restore_sql.py \
            scripts/verify_database_restore.py \
            scripts/verify_storage_security.py \
            scripts/verify_auth_restore.py \
            scripts/verify_vault_restore.py \
            scripts/verify_migration_ledger.py \
            scripts/apply_sql_safely.py \
            scripts/create_restore_expectations.py \
            scripts/test_restore_expectations.py

      - name: Test backup manifest generation and verification
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          mkdir -p "$TEST_DIR/database"
          printf 'schema test\n' > "$TEST_DIR/database/schema.sql"
          printf 'data test\n' > "$TEST_DIR/database/data.sql"
          python3 scripts/create_backup_manifest.py "$TEST_DIR"
          python3 scripts/verify_backup_manifest.py "$TEST_DIR"
          printf 'tamper\n' >> "$TEST_DIR/database/data.sql"
          if python3 scripts/verify_backup_manifest.py "$TEST_DIR"; then
            echo "::error::Manifest verifier did not detect modified content"
            exit 1
          fi

      - name: Test database restore expectation parsing
        run: python3 scripts/test_restore_expectations.py

      - name: Test Auth and Vault restore SQL generation
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          mkdir -p "$TEST_DIR/auth" "$TEST_DIR/secrets" "$TEST_DIR/storage" "$TEST_DIR/database"
          printf '[{"version":"20260101000000","name":"initial_schema"}]' > "$TEST_DIR/database/migration-ledger.json"
          printf '[{"id":"00000000-0000-0000-0000-000000000001","email":"owner@example.invalid"}]' > "$TEST_DIR/auth/users.json"
          printf '[{"id":"00000000-0000-0000-0000-000000000002","user_id":"00000000-0000-0000-0000-000000000001","provider":"email"}]' > "$TEST_DIR/auth/identities.json"
          printf '[{"name":"test_secret","description":"test description","secret":"dummy-secret"}]' > "$TEST_DIR/secrets/vault-secrets.json"
          cat > "$TEST_DIR/storage/policies.json" <<'JSON'
          [{"schemaname":"storage","tablename":"objects","policyname":"test policy","permissive":"PERMISSIVE","roles":["anon","authenticated"],"cmd":"SELECT","qual":"(bucket_id = 'poetry-media'::text)","with_check":null}]
          JSON
          cat > "$TEST_DIR/storage/security-settings.json" <<'JSON'
          {"tables":[{"table":"objects","rowsecurity":true,"forcerowsecurity":false}],"grants":[]}
          JSON
          python3 scripts/generate_restore_sql.py --root "$TEST_DIR"
          grep -Fq 'create policy "test policy" on "storage"."objects"' "$TEST_DIR/restore/storage-policies.sql"
          grep -Fq 'alter table "storage"."objects" enable row level security' "$TEST_DIR/restore/storage-policies.sql"
          grep -q 'jsonb_populate_recordset(null::auth.users' "$TEST_DIR/restore/auth-restore.sql"
          grep -q "vault.create_secret('dummy-secret', 'test_secret'" "$TEST_DIR/restore/vault-restore.sql"
          grep -q "insert into supabase_migrations.schema_migrations" "$TEST_DIR/restore/migration-ledger-restore.sql"
          grep -q "initial_schema" "$TEST_DIR/restore/migration-ledger-restore.sql"

      - name: Validate YAML and Supabase TOML syntax
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true); puts "YAML OK: #{f}" }' \
            .github/workflows/google-drive-backup.yml \
            .github/workflows/validate-backup-tooling.yml
          python3 -c 'import tomllib; tomllib.load(open("supabase/config.toml", "rb")); print("Supabase TOML OK")'

      - name: Check OAuth callback TypeScript formatting and types
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/google-drive-oauth-callback/index.ts
      - run: deno check scripts/restore_storage.ts

      - name: Start disposable Supabase Storage integration-test target
        run: |
          set -euo pipefail
          LOCAL_PROJECT="$RUNNER_TEMP/storage-restore-test-project"
          mkdir -p "$LOCAL_PROJECT/supabase/migrations"
          printf 'project_id = "storage-restore-test"\n' > "$LOCAL_PROJECT/supabase/config.toml"
          if ! supabase --workdir "$LOCAL_PROJECT" start --exclude studio,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/storage-restore-start.log" 2>&1; then
            sed -E '/(secret key:|publishable key:|sb_secret_|sb_publishable_)/Id' "$RUNNER_TEMP/storage-restore-start.log" | tail -n 80
            exit 1
          fi
          touch "$RUNNER_TEMP/storage-restore.started"
          supabase --workdir "$LOCAL_PROJECT" status -o env > "$RUNNER_TEMP/storage-restore.env"
          if ! grep -q '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/storage-restore.env"; then
            echo "::error::Local Supabase CLI did not expose the local Storage admin key required for integration testing."
            exit 1
          fi
          printf "Local Supabase environment is ready for the isolated Storage test.\n"

      - name: Test migration ledger restore round trip
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/storage-restore.env"
          set +a
          ROOT="$RUNNER_TEMP/migration-ledger-restore-fixture"
          mkdir -p "$ROOT/database" "$ROOT/auth" "$ROOT/secrets" "$ROOT/storage"
          cat > "$ROOT/database/migration-ledger.json" <<'JSON'
          [{"version":"20990101010101","statements":["select 1;"],"name":"backup_round_trip_test","created_by":"ci","idempotency_key":"green-dream-ledger-test","rollback":["select 1;"]}]
          JSON
          printf '[]\n' > "$ROOT/auth/users.json"
          printf '[]\n' > "$ROOT/auth/identities.json"
          printf '[]\n' > "$ROOT/secrets/vault-secrets.json"
          printf '[]\n' > "$ROOT/storage/policies.json"
          printf '{"tables":[],"grants":[]}\n' > "$ROOT/storage/security-settings.json"
          python3 scripts/generate_restore_sql.py --root "$ROOT"
          DATABASE_URL="$DB_URL" python3 scripts/apply_sql_safely.py "$ROOT/restore/migration-ledger-restore.sql"
          DATABASE_URL="$DB_URL" python3 scripts/verify_migration_ledger.py "$ROOT"
          rm -rf "$ROOT"

      - name: Test Storage bucket and object restoration end to end
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/storage-restore.env"
          set +a
          ROOT="$RUNNER_TEMP/storage-restore-fixture"
          mkdir -p "$ROOT/storage/objects/poetry-media"
          printf 'Green Dream Storage restore integration test\n' > "$ROOT/storage/objects/poetry-media/hello.txt"
          BYTES="$(wc -c < "$ROOT/storage/objects/poetry-media/hello.txt" | tr -d ' ')"
          SHA="$(sha256sum "$ROOT/storage/objects/poetry-media/hello.txt" | awk '{print $1}')"
          cat > "$ROOT/storage/buckets.json" <<'JSON'
          [{"id":"poetry-media","name":"poetry-media","public":true,"file_size_limit":52428800,"allowed_mime_types":["text/plain"]},{"id":"poetry-media-staging","name":"poetry-media-staging","public":false,"file_size_limit":52428800,"allowed_mime_types":["text/plain"]},{"id":"vha-post-media","name":"vha-post-media","public":true,"file_size_limit":52428800,"allowed_mime_types":["text/plain"]}]
          JSON
          cat > "$ROOT/storage/objects-metadata.json" <<JSON
          [{"bucket_id":"poetry-media","name":"hello.txt","metadata":{"mimetype":"text/plain","size":$BYTES,"cacheControl":"3600"},"user_metadata":{"source":"validation"}}]
          JSON
          cat > "$ROOT/storage/objects/storage-manifest.json" <<JSON
          {"object_count":1,"objects":[{"bucket":"poetry-media","path":"hello.txt","bytes":$BYTES,"sha256":"$SHA"}]}
          JSON
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
            deno run --allow-env --allow-read --allow-net scripts/restore_storage.ts "$ROOT"
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" \
            python3 scripts/backup_storage.py --output "$ROOT/storage/objects"
          python3 scripts/verify_storage_export.py "$ROOT"

      - name: Stop disposable Storage integration-test target
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/storage-restore.started" ]; then
            supabase --workdir "$RUNNER_TEMP/storage-restore-test-project" stop --no-backup
          fi
          rm -rf "$RUNNER_TEMP/storage-restore-test-project" "$RUNNER_TEMP/storage-restore-fixture"
          rm -f "$RUNNER_TEMP/storage-restore.env" "$RUNNER_TEMP/storage-restore-start.log" "$RUNNER_TEMP/storage-restore.started"
