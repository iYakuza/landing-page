name: Import EGO portrait into recovery copy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recovery-portrait-import
  cancel-in-progress: false

jobs:
  import-portrait:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v6
        with:
          ref: recovery-drill-preview

      - name: Download and verify the EGO portrait
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://emanuelstefancu.wordpress.com/wp-content/uploads/2026/11/emanuel-ego-portrait.png'
          output="$RUNNER_TEMP/emanuel-ego-portrait.png"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors "$source_url" --output "$output"
          python3 - "$output" <<'PY'
          import pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded file is not a valid PNG.")
          width, height = struct.unpack(">II", data[16:24])
          if width < 100 or height < 100 or len(data) > 25 * 1024 * 1024:
              raise SystemExit(f"Portrait dimensions or size are unexpected: {width}x{height}, {len(data)} bytes.")
          print(f"Verified PNG: {width}x{height}, {len(data)} bytes.")
          PY

      - name: Add the recovery-controlled asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/recovery
          install -m 0644 "$RUNNER_TEMP/emanuel-ego-portrait.png" assets/recovery/emanuel-ego-portrait.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          html = Path("human-archive/index.html")
          source = "https://emanuelstefancu.wordpress.com/wp-content/uploads/2026/11/emanuel-ego-portrait.png"
          local = "/landing-page/assets/recovery/emanuel-ego-portrait.png"
          text = html.read_text(encoding="utf-8")
          if source in text:
              text = text.replace(source, local)
          elif local not in text:
              raise SystemExit("Expected EGO portrait source was not found in the Human Archive page.")
          text = text.replace("img-src 'self' data: https://emanuelstefancu.wordpress.com;", "img-src 'self' data:")
          html.write_text(text, encoding="utf-8")

          headers = Path("_headers")
          text = headers.read_text(encoding="utf-8")
          text = text.replace(" https://emanuelstefancu.wordpress.com;", ";")
          headers.write_text(text, encoding="utf-8")
          PY
          git add assets/recovery/emanuel-ego-portrait.png human-archive/index.html _headers
          if git diff --cached --quiet; then
            echo "Portrait is already present; no commit needed."
            exit 0
          fi
          git commit -m "Store EGO portrait in recovery repository"
          git push origin HEAD:recovery-drill-preview
