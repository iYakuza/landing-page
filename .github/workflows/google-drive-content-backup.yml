name: Green Dream content and media backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-dream-drive-backup
  cancel-in-progress: false

jobs:
  content-backup:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/backup/'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: https://oeyxsqocldlovhsmzcjw.supabase.co

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install backup dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client gnupg python3
          python3 --version
          psql --version
          gpg --version

      - name: Install a pinned Supabase CLI v2
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Validate the offline recovery website builder
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_recovery_site.py scripts/package_recovery_site.py scripts/upload_apps_script_backup.py scripts/download_apps_script_backup.py scripts/test_upload_apps_script_backup.py scripts/test_download_apps_script_backup.py scripts/test_backup_manifest.py scripts/test_build_recovery_site.py scripts/backup_wordpress_archive.py scripts/test_backup_wordpress_archive.py
          python3 scripts/test_build_recovery_site.py
          python3 scripts/test_backup_wordpress_archive.py
          python3 scripts/test_upload_apps_script_backup.py
          python3 scripts/test_download_apps_script_backup.py
          python3 scripts/test_backup_manifest.py
          node --check < google-apps-script/Code.gs
          node google-apps-script/test_receiver.js

      - name: Validate required credentials
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_DRIVE_INGEST_URL: ${{ secrets.GOOGLE_DRIVE_INGEST_URL }}
          GOOGLE_DRIVE_INGEST_TOKEN: ${{ secrets.GOOGLE_DRIVE_INGEST_TOKEN }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL SUPABASE_SECRET_KEY GOOGLE_DRIVE_INGEST_URL GOOGLE_DRIVE_INGEST_TOKEN BACKUP_ENCRYPTION_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string"; exit 1 ;;
          esac
          case "$GOOGLE_DRIVE_INGEST_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "::error::GOOGLE_DRIVE_INGEST_URL must be a deployed Apps Script web app URL"; exit 1 ;;
          esac
          if [ "${#GOOGLE_DRIVE_INGEST_TOKEN}" -lt 40 ]; then
            echo "::error::GOOGLE_DRIVE_INGEST_TOKEN must be at least 40 characters"
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters"
            exit 1
          fi

      - name: Create content backup workspace
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/green-dream-content-backup"/{database,storage,repository,metadata}

      - name: Export website database content
        timeout-minutes: 30
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/green-dream-content-backup"
          supabase db dump --db-url "$DB_URL" -f "$OUT/database/public-schema.sql"
          supabase db dump --db-url "$DB_URL" -f "$OUT/database/public-data.sql" --data-only --use-copy
          test -s "$OUT/database/public-schema.sql"
          test -s "$OUT/database/public-data.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(to_jsonb(b) order by id), '[]'::json) from storage.buckets b" \
            > "$OUT/storage/buckets.json"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(to_jsonb(o) order by bucket_id, name), '[]'::json) from storage.objects o" \
            > "$OUT/storage/objects-metadata.json"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(json_build_object('schema', table_schema, 'table', table_name) order by table_name), '[]'::json) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'" \
            > "$OUT/database/public-table-inventory.json"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select json_build_object('captured_at', now(), 'postgres_version', version(), 'scope', 'public schema data plus Supabase Storage objects')::text" \
            > "$OUT/metadata/content-snapshot.json"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select json_build_object('posts', (select coalesce(json_agg(json_build_object('title',title,'slug',slug,'category',category,'excerpt',excerpt,'content_html',content_html,'published_at',published_at,'media_url',media_url,'media_path',media_path,'media_type',media_type,'media_width',media_width) order by published_at desc nulls last), '[]'::json) from public.vha_posts where status='published'), 'submissions', (select coalesce(json_agg(json_build_object('title',title,'slug',slug,'medium',medium,'body',body,'byline',byline,'published_at',published_at,'media_url',media_url,'storage_path',storage_path) order by published_at desc nulls last), '[]'::json) from public.poetry_submissions where status='published' and rights_confirmed is true), 'transmissions', (select coalesce(json_agg(json_build_object('title',title,'message',message,'display_name',display_name,'created_at',created_at) order by created_at desc nulls last), '[]'::json) from public.sys_transmissions where status='published' and rights_confirmed is true and publication_consent is true))::text" \
            > "$OUT/database/public-content.json"
          python3 -m json.tool "$OUT/database/public-content.json" >/dev/null

      - name: Download and verify every Supabase Storage object
        timeout-minutes: 45
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/green-dream-content-backup"
          python3 scripts/backup_storage.py --output "$OUT/storage/objects" --buckets-file "$OUT/storage/buckets.json"
          python3 scripts/verify_storage_export.py "$OUT"

      - name: Export WordPress posts and private media archive
        timeout-minutes: 90
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/green-dream-content-backup"
          python3 scripts/backup_wordpress_archive.py --output "$OUT/wordpress" --index human-archive/archive-data.json --media-index wordpress/media-library-index.json
          python3 scripts/build_recovery_site.py "$OUT"
          python3 scripts/package_recovery_site.py "$OUT" "$RUNNER_TEMP/green-dream-recovery-site.zip"

      - name: Capture complete website repository and media assets
        timeout-minutes: 10
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/green-dream-content-backup"
          git bundle create "$OUT/repository/landing-page.bundle" --all
          git rev-parse HEAD > "$OUT/metadata/repository-commit.txt"
          git bundle verify "$OUT/repository/landing-page.bundle"
          git bundle list-heads "$OUT/repository/landing-page.bundle" > "$OUT/metadata/repository-bundle-heads.txt"
          grep -Fq "$(cat "$OUT/metadata/repository-commit.txt")" "$OUT/metadata/repository-bundle-heads.txt"
          cat > "$OUT/CONTENT-BACKUP-README.txt" <<'EOF'
          GREEN DREAM CONTENT AND MEDIA BACKUP

          This archive contains:
          - PostgreSQL public schema definition (public-schema.sql) and row data (public-data.sql)
          - Inventory of public database tables
          - Supabase Storage bucket configuration and object metadata
          - Downloaded bytes for every object in every listed Storage bucket
          - Complete Git repository history and tracked website assets
          - Live published WordPress post export and WordPress media-library binaries
          - Offline read-only recovery website at recovery-site/index.html (published content, WordPress post text, and public media links)

          This is a CONTENT RECOVERY BACKUP, not a complete Supabase project image.
          It does not include PostgreSQL roles, Auth, Vault, project settings, runtime
          secrets, or every database permission. The public schema and data files
          are recovery inputs, but their restoration still requires a compatible
          Supabase/PostgreSQL environment and a separate restore test. Full-system
          recovery remains a separate validation task.
          EOF

      - name: Generate and verify file checksums
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/green-dream-content-backup"
          python3 scripts/create_backup_manifest.py "$OUT"
          python3 scripts/verify_backup_manifest.py "$OUT"

      - name: Encrypt and verify the content archive
        timeout-minutes: 30
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/green-dream-content-backup"
          ARCHIVE="$RUNNER_TEMP/greendream-content-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          ENCRYPTED="$ARCHIVE.gpg"
          tar -czf "$ARCHIVE" -C "$WORK" .
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --compress-algo none --symmetric --cipher-algo AES256 \
                --output "$ENCRYPTED" "$ARCHIVE"
          shred -u "$ARCHIVE" || rm -f "$ARCHIVE"
          VERIFY="$RUNNER_TEMP/greendream-content-verify.tar.gz"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --decrypt --output "$VERIFY" "$ENCRYPTED"
          tar -tzf "$VERIFY" >/dev/null
          shred -u "$VERIFY" || rm -f "$VERIFY"
          echo "ENCRYPTED_ARCHIVE=$ENCRYPTED" >> "$GITHUB_ENV"
          ls -lh "$ENCRYPTED"

      - name: Upload encrypted content archive to private Google Drive
        timeout-minutes: 25
        env:
          GOOGLE_DRIVE_INGEST_URL: ${{ secrets.GOOGLE_DRIVE_INGEST_URL }}
          GOOGLE_DRIVE_INGEST_TOKEN: ${{ secrets.GOOGLE_DRIVE_INGEST_TOKEN }}
          BACKUP_TYPE: content
        run: |
          set -euo pipefail
          python3 scripts/upload_apps_script_backup.py "$ENCRYPTED_ARCHIVE"

      - name: Publish portable read-only recovery website
        uses: actions/upload-artifact@v4
        with:
          name: green-dream-recovery-site-${{ github.run_id }}
          path: ${{ runner.temp }}/green-dream-recovery-site.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary content backup material
        if: always()
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/green-dream-content-backup"
          rm -f "$RUNNER_TEMP"/greendream-content-*.tar.gz "$RUNNER_TEMP"/greendream-content-*.tar.gz.gpg
          rm -f "$RUNNER_TEMP/greendream-content-verify.tar.gz"
          if [ -n "${ENCRYPTED_ARCHIVE:-}" ]; then rm -f "$ENCRYPTED_ARCHIVE"; fi
