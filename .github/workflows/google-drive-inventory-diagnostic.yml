name: Google Drive read-only inventory diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-inventory-diagnostic
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only Drive inventory probe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out tested backup transport
        uses: actions/checkout@v6
        with:
          ref: backup/apps-script-transfer-redesign
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate receiver secrets
        env:
          GOOGLE_DRIVE_INGEST_URL: ${{ secrets.GOOGLE_DRIVE_INGEST_URL }}
          GOOGLE_DRIVE_INGEST_TOKEN: ${{ secrets.GOOGLE_DRIVE_INGEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_INGEST_URL" || { echo "::error::GOOGLE_DRIVE_INGEST_URL is missing"; exit 1; }
          test -n "$GOOGLE_DRIVE_INGEST_TOKEN" || { echo "::error::GOOGLE_DRIVE_INGEST_TOKEN is missing"; exit 1; }
          case "$GOOGLE_DRIVE_INGEST_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "::error::GOOGLE_DRIVE_INGEST_URL is not a deployed Apps Script web app URL"; exit 1 ;;
          esac
          if [ "${#GOOGLE_DRIVE_INGEST_TOKEN}" -lt 40 ]; then
            echo "::error::GOOGLE_DRIVE_INGEST_TOKEN must be at least 40 characters"
            exit 1
          fi
          echo "Receiver endpoint and required secrets are present."

      - name: Probe one-part and 79-part inventories using production transport
        env:
          GOOGLE_DRIVE_INGEST_URL: ${{ secrets.GOOGLE_DRIVE_INGEST_URL }}
          GOOGLE_DRIVE_INGEST_TOKEN: ${{ secrets.GOOGLE_DRIVE_INGEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import hashlib
          import os
          import apps_script_transport

          endpoint = os.environ["GOOGLE_DRIVE_INGEST_URL"]
          token = os.environ["GOOGLE_DRIVE_INGEST_TOKEN"]

          def probe(backup_id, count):
              parts = [
                  {
                      "part_number": number,
                      "size": 4 * 1024 * 1024,
                      "sha256": hashlib.sha256(f"read-only-probe-{number}".encode()).hexdigest(),
                  }
                  for number in range(1, count + 1)
              ]
              print(f"Starting read-only inventory probe for {count} part(s).", flush=True)
              result = apps_script_transport.post_json(
                  endpoint,
                  token,
                  {
                      "action": "list_upload_parts",
                      "backup_id": backup_id,
                      "total_parts": count,
                      "parts": parts,
                  },
                  timeout=60,
                  retries=2,
              )
              if not (
                  result.get("ok") is True
                  and result.get("backup_id") == backup_id
                  and result.get("total_parts") == count
                  and result.get("completed") is False
                  and result.get("parts") == []
              ):
                  safe = {
                      "ok": result.get("ok"),
                      "error": result.get("error"),
                      "diagnostic": result.get("diagnostic"),
                      "backup_id": result.get("backup_id"),
                      "total_parts": result.get("total_parts"),
                      "existing_parts": len(result.get("parts", []))
                          if isinstance(result.get("parts"), list) else None,
                  }
                  raise RuntimeError(f"Unexpected read-only inventory response: {safe}")
              print(
                  f"PASS: {count} expected part(s), 0 existing parts, completed=false.",
                  flush=True,
              )

          probe("system-20261113T235901Z-1a2b3c4d", 1)
          probe("system-20261113T235902Z-5e6f7a8b", 79)
          print("Both read-only probes passed using the production transport.", flush=True)
          print("No Drive files, upload sessions or manifests were created.", flush=True)
          PY
