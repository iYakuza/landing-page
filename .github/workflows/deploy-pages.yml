name: Deploy GitHub Pages

on:
  # Wait until the visitor changelog has finished updating, so a public
  # content push results in one deployment containing both site files and feed.
  workflow_run:
    workflows: ["Publish visitor-friendly changelog"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the latest published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare public website files
        shell: bash
        run: |
          set -euo pipefail

          site_dir="${RUNNER_TEMP}/pages-site"
          mkdir -p "$site_dir"

          # Keep the website tree intact while leaving repository-only material
          # out of the published artifact. Exclude dotfiles by default.
          rsync -a \
            --exclude='.*' \
            --exclude='/docs/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/google-apps-script/' \
            ./ "$site_dir/"

          # security.txt is intentionally public and must survive hidden-file filtering.
          mkdir -p "$site_dir/.well-known"
          cp -a .well-known/. "$site_dir/.well-known/"

          # Fail before deployment if a key public route or policy file is absent.
          for required in \
            index.html \
            cv/index.html \
            human-archive/index.html \
            transmissions/index.html \
            content/human-archive.json \
            content/transmissions.json \
            robots.txt \
            sitemap.xml \
            SECURITY.md \
            .well-known/security.txt
          do
            test -s "$site_dir/$required" || {
              echo "Missing required public file: $required" >&2
              exit 1
            }
          done

      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
