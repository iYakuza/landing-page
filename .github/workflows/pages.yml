name: Deploy Green Dream draft preview
on:
  push:
    branches: [green-dream-draft]
    paths:
      - 'green-dream/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Green Dream static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: green-dream
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
