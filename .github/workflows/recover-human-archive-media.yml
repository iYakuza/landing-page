name: Recover Human Archive media from WordPress

on:
  push:
    branches:
      - recovery/supabase-content-export-20261119
    paths:
      - .github/workflows/recover-human-archive-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and verify WordPress attachments
        env:
          EXPECTED_BRANCH: recovery/supabase-content-export-20261119
          COMMIT_MEDIA: "false"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const expectedBranch = process.env.EXPECTED_BRANCH;
          if (process.env.GITHUB_REF_NAME !== expectedBranch) {
            throw new Error(`Refusing to run on unexpected branch: ${process.env.GITHUB_REF_NAME}`);
          }

          const manifest = JSON.parse(await fs.readFile('human-archive/media-manifest.json', 'utf8'));
          const canonical = JSON.parse(await fs.readFile('content/human-archive.json', 'utf8'));
          if (!Array.isArray(manifest.items) || manifest.items.length !== manifest.item_count) {
            throw new Error('Media manifest count does not match its items array.');
          }

          // Find canonical Human Archive records without assuming the JSON wrapper shape.
          const records = [];
          const visit = value => {
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
            } else if (value && typeof value === 'object') {
              if (typeof value.id === 'string' && /^HA-\d+$/.test(value.id) && value.legacy_id != null) {
                records.push(value);
              }
              for (const child of Object.values(value)) {
                if (child && typeof child === 'object') visit(child);
              }
            }
          };
          visit(canonical);

          const recordByLegacyId = new Map(records.map(record => [String(record.legacy_id), record.id]));
          if (recordByLegacyId.size !== 140) {
            throw new Error(`Expected 140 unique canonical Human Archive records; found ${recordByLegacyId.size}.`);
          }

          const attachments = manifest.items.filter(item => item.wp_media_id != null);
          const external = manifest.items.filter(item => item.wp_media_id == null);
          if (attachments.length !== 108) {
            throw new Error(`Expected 108 WordPress attachments; found ${attachments.length}.`);
          }

          const outputRoot = 'recovery-output/media/human-archive';
          await fs.rm('recovery-output', { recursive: true, force: true });
          await fs.mkdir(outputRoot, { recursive: true });

          const safeFilename = item => {
            const source = new URL(item.source_url);
            const raw = decodeURIComponent(source.pathname.split('/').pop() || `attachment-${item.wp_media_id}`);
            const extension = path.extname(raw).slice(0, 12).toLowerCase();
            const stem = path.basename(raw, path.extname(raw))
              .normalize('NFKD')
              .replace(/[^a-zA-Z0-9._-]+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '')
              .slice(0, 100) || 'media';
            return `${item.wp_media_id}-${stem}${extension}`;
          };

          const download = async item => {
            const source = new URL(item.source_url);
            if (source.protocol !== 'https:' || source.hostname !== 'emanuelstefancu.wordpress.com') {
              throw new Error(`Unapproved WordPress source host: ${source.hostname}`);
            }
            const legacyIds = item.post_ids || [];
            if (!legacyIds.length) throw new Error('Attachment has no linked WordPress post ID.');

            const targets = legacyIds.map(legacyId => {
              const canonicalId = recordByLegacyId.get(String(legacyId));
              if (!canonicalId) throw new Error(`No canonical HA record for legacy post ${legacyId}.`);
              return { canonicalId, filename: safeFilename(item) };
            });

            let response;
            for (let attempt = 1; attempt <= 4; attempt++) {
              response = await fetch(item.source_url, { redirect: 'follow' });
              if (response.ok) break;
              if (attempt === 4 || (response.status < 500 && response.status !== 429)) {
                throw new Error(`Source returned HTTP ${response.status}.`);
              }
              await new Promise(resolve => setTimeout(resolve, attempt * 1500));
            }

            const bytes = Buffer.from(await response.arrayBuffer());
            if (!bytes.length) throw new Error('Downloaded file is empty.');
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            const actualMime = (response.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();

            const savedPaths = [];
            for (const target of targets) {
              const folder = path.join(outputRoot, target.canonicalId);
              await fs.mkdir(folder, { recursive: true });
              const destination = path.join(folder, target.filename);
              await fs.writeFile(destination, bytes, { flag: 'wx' });
              savedPaths.push(destination.slice('recovery-output/'.length));
            }

            return {
              id: item.id,
              wp_media_id: item.wp_media_id,
              legacy_post_ids: legacyIds,
              canonical_record_ids: targets.map(target => target.canonicalId),
              source_url: item.source_url,
              mime_type: item.mime_type,
              detected_mime_type: actualMime || null,
              expected_bytes: item.expected_size || null,
              downloaded_bytes: bytes.length,
              expected_size_matches: item.expected_size ? item.expected_size === bytes.length : null,
              sha256,
              local_paths: savedPaths,
              verified: true
            };
          };

          const results = [];
          const failures = [];
          let next = 0;
          const workers = Array.from({ length: 4 }, async () => {
            while (true) {
              const index = next++;
              if (index >= attachments.length) return;
              const item = attachments[index];
              try {
                const result = await download(item);
                results.push(result);
                console.log(`[${results.length + failures.length}/${attachments.length}] VERIFIED ${item.id}`);
              } catch (error) {
                failures.push({ id: item.id, wp_media_id: item.wp_media_id, error: String(error?.message || error) });
                console.error(`FAILED ${item.id}: ${String(error?.message || error)}`);
              }
            }
          });
          await Promise.all(workers);

          const totalBytes = results.reduce((sum, item) => sum + item.downloaded_bytes, 0);
          const report = {
            generated_at: new Date().toISOString(),
            source: 'Connected WordPress media library',
            target_branch: expectedBranch,
            status: failures.length === 0 && results.length === attachments.length ? 'verified' : 'incomplete',
            expected_wordpress_attachments: attachments.length,
            downloaded_and_verified: results.length,
            failed: failures.length,
            external_references_skipped_for_separate_review: external.map(item => ({
              id: item.id,
              source_url: item.source_url,
              post_ids: item.post_ids || []
            })),
            total_bytes_downloaded: totalBytes,
            total_mib_downloaded: Number((totalBytes / 1024 / 1024).toFixed(2)),
            files: results,
            failures
          };
          await fs.mkdir('recovery-output', { recursive: true });
          await fs.writeFile('recovery-output/media-recovery-report.json', JSON.stringify(report, null, 2) + '\n');

          if (failures.length || results.length !== attachments.length) {
            throw new Error(`Recovery incomplete: ${results.length}/${attachments.length} attachments verified.`);
          }

          // This first run is deliberately non-writing. A later, separately approved
          // run can enable the commit step after the downloaded artifact is reviewed.
          if (process.env.COMMIT_MEDIA === 'true') {
            for (const record of results) {
              for (const relativePath of record.local_paths) {
                const sourcePath = path.join('recovery-output', relativePath);
                const destinationPath = path.join('media', 'human-archive', relativePath.split('/').slice(2).join('/'));
                await fs.mkdir(path.dirname(destinationPath), { recursive: true });
                const bytes = await fs.readFile(sourcePath);
                try {
                  await fs.writeFile(destinationPath, bytes, { flag: 'wx' });
                } catch (error) {
                  if (error.code !== 'EEXIST') throw error;
                  const existing = await fs.readFile(destinationPath);
                  const existingHash = crypto.createHash('sha256').update(existing).digest('hex');
                  const incomingHash = crypto.createHash('sha256').update(bytes).digest('hex');
                  if (existingHash !== incomingHash) throw new Error(`Refusing to overwrite different existing file: ${destinationPath}`);
                }
              }
            }
            const { execFileSync } = await import('node:child_process');
            execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git', ['add', 'media/human-archive']);
            try {
              execFileSync('git', ['commit', '-m', 'Recover Human Archive media from WordPress']);
              execFileSync('git', ['push', 'origin', `HEAD:${expectedBranch}`]);
            } catch (error) {
              if (!String(error?.message || error).includes('nothing to commit')) throw error;
            }
          }

          console.log(`Verified ${results.length} WordPress attachments (${(totalBytes / 1024 / 1024).toFixed(2)} MiB).`);
          NODE

      - name: Upload the verified files and report for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: human-archive-wordpress-media-recovery
          path: recovery-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
