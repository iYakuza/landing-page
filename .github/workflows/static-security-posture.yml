name: Static security posture checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-source-checks:
    name: Check static security controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate the single-site security posture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import re
          import sys
          import xml.etree.ElementTree as ET

          errors = []
          warnings = []

          required_pages = [
              "index.html",
              "green-dream/index.html",
              "cv/index.html",
              "cms/index.html",
              "human-archive/index.html",
              "signals/index.html",
              "transmissions/index.html",
              "transmissions/the-awakening/index.html",
              "transmissions/the-descent/index.html",
              "transmissions/the-reconnection/index.html",
              "transmissions/the-transformation/index.html",
              "transmissions/the-return/index.html",
              "secure-your-soul/index.html",
          ]

          external_script_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["']https?://""",
              re.IGNORECASE,
          )
          for relative in required_pages:
              path = Path(relative)
              if not path.is_file():
                  errors.append(f"Required page is missing: {relative}")
                  continue
              html = path.read_text(encoding="utf-8")
              csp = re.search(
                  r"""<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]+content=["']([^"']+)["']""",
                  html,
                  re.IGNORECASE,
              )
              if not csp:
                  errors.append(f"Content Security Policy is missing: {relative}")
                  continue
              policy = csp.group(1).lower()
              for directive in ("default-src", "base-uri", "object-src", "script-src", "form-action"):
                  if directive not in policy:
                      errors.append(f"{relative}: CSP is missing {directive}.")
              if "object-src 'none'" not in policy:
                  errors.append(f"{relative}: CSP must retain object-src 'none'.")
              if "unsafe-inline" in re.search(r"script-src[^;]*", policy).group(0):
                  errors.append(f"{relative}: inline script execution must not be allowed.")
              if external_script_pattern.search(html):
                  errors.append(f"{relative}: scripts must be served from the website itself.")
              img_src = re.search(r"img-src[^;]*", policy)
              if img_src and re.search(r"https?://", img_src.group(0)):
                  errors.append(f"{relative}: images must be served from local website media.")

          analytics_path = Path("analytics.js")
          if analytics_path.exists():
              errors.append("A standalone visitor-tracking script must not be included in the site.")
          for relative in required_pages:
              path = Path(relative)
              if path.exists() and re.search(r"""<script\b[^>]*src=["'][^"']*analytics\.js""", path.read_text(encoding="utf-8"), re.IGNORECASE):
                  errors.append(f"{relative}: standalone visitor tracking must not be loaded.")

          creator_path = Path("creator-posting.js")
          creator = creator_path.read_text(encoding="utf-8") if creator_path.exists() else ""
          if not creator:
              errors.append("Creator posting controller is missing.")
          if "/landing-page/cms/github-client.js" not in creator:
              errors.append("Creator controller must load the GitHub CMS client.")
          if "window.VHAGitHub.restoreSession()" not in creator:
              errors.append("Creator controller must restore the GitHub owner session.")

          archive_path = Path("content/human-archive.json")
          if not archive_path.is_file():
              errors.append("Canonical Human Archive content is missing.")
          else:
              try:
                  archive = json.loads(archive_path.read_text(encoding="utf-8"))
                  manifest = archive.get("media_manifest", {})
                  items = manifest.get("items", [])
                  if not items:
                      errors.append("The GitHub media manifest is empty.")
                  if "public_base_url" in manifest or "bucket" in manifest:
                      errors.append("The media manifest must use local GitHub storage only.")
                  for item in items:
                      if item.get("recovery_status") != "verified":
                          errors.append(f"Media is not verified: {item.get('id', 'unknown')}")
                          continue
                      if item.get("storage") != "github-public":
                          errors.append(f"Media is not stored in the public GitHub repository: {item.get('id', 'unknown')}")
                      local_path = item.get("local_path")
                      if not local_path or not Path(local_path).is_file():
                          errors.append(f"Local media file is missing: {local_path or item.get('id', 'unknown')}")
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"Canonical Human Archive content is invalid: {exc}")

          pending_media = 0
          for collection_path in ("content/transmissions.json", "content/signals.json"):
              try:
                  collection = json.loads(Path(collection_path).read_text(encoding="utf-8"))
                  for record in collection.get("records", []):
                      for item in record.get("media_items", []):
                          if item.get("status") in ("pending_recovery", "pending"):
                              pending_media += 1
                              if item.get("source_url"):
                                  errors.append(f"Pending media must not retain a remote source URL: {record.get('id', 'unknown')}")
              except (OSError, json.JSONDecodeError):
                  errors.append(f"Could not inspect {collection_path}.")
          if pending_media:
              warnings.append(f"{pending_media} media item(s) remain unavailable until local files are added; the public reader suppresses them.")

          security_path = Path(".well-known/security.txt")
          if not security_path.is_file():
              errors.append(".well-known/security.txt is missing.")
          else:
              security_txt = security_path.read_text(encoding="utf-8")
              for field in ("Contact:", "Canonical:", "Policy:", "Expires:"):
                  if not re.search(r"^" + re.escape(field), security_txt, re.MULTILINE):
                      errors.append(f"security.txt is missing {field}")
              expiry = re.search(r"^Expires:\s*(.+)$", security_txt, re.MULTILINE)
              if expiry:
                  try:
                      expiry_date = datetime.fromisoformat(expiry.group(1).replace("Z", "+00:00"))
                      if expiry_date <= datetime.now(timezone.utc):
                          errors.append("security.txt Expires date is not in the future.")
                  except ValueError:
                      errors.append("security.txt Expires date is not valid ISO 8601.")

          robots_path = Path("robots.txt")
          if not robots_path.is_file() or "Sitemap: https://iyakuza.github.io/landing-page/sitemap.xml" not in robots_path.read_text(encoding="utf-8"):
              errors.append("robots.txt must point to the published sitemap.")

          sitemap_path = Path("sitemap.xml")
          if not sitemap_path.is_file():
              errors.append("sitemap.xml is missing.")
          else:
              try:
                  ET.parse(sitemap_path)
              except ET.ParseError as exc:
                  errors.append(f"sitemap.xml is not valid XML: {exc}")

          for warning in warnings:
              print(f"::warning::{warning}")
          for error in errors:
              print(f"::error::{error}")

          if errors:
              print(f"Security source checks failed: {len(errors)} error(s), {len(warnings)} warning(s).")
              sys.exit(1)
          print(f"Security source checks passed. Warnings: {len(warnings)}.")
          PY
