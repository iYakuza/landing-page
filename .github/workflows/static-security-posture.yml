name: Static security posture checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-source-checks:
    name: Check static security controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate security controls and public metadata
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          import json
          import sys
          import xml.etree.ElementTree as ET

          errors = []
          warnings = []

          html_path = Path("index.html")
          if not html_path.exists():
              errors.append("index.html is missing.")
              html = ""
          else:
              html = html_path.read_text(encoding="utf-8")

          csp_match = re.search(
              r"""<meta[^>]+http-equiv="Content-Security-Policy"[^>]+content="([^"]+)""",
              html,
              re.IGNORECASE,
          )
          if not csp_match:
              errors.append("Homepage CSP meta policy is missing.")
          else:
              csp = csp_match.group(1).lower()
              for directive in ("default-src", "base-uri", "object-src", "script-src", "form-action"):
                  if directive not in csp:
                      errors.append(f"CSP is missing the {directive} directive.")
              if "object-src 'none'" not in csp:
                  errors.append("CSP must keep object-src 'none'.")

          analytics_tags = re.findall(
              r"""<script\b[^>]*src=["'][^"']*analytics\.js[^"']*["'][^>]*>""",
              html,
              re.IGNORECASE,
          )
          if len(analytics_tags) != 1:
              errors.append(f"Expected exactly one analytics.js script tag; found {len(analytics_tags)}.")

          script_tags = re.findall(
              r"""<script\b[^>]*src=["']([^"']+)["'][^>]*>""",
              html,
              re.IGNORECASE,
          )
          full_script_tags = re.findall(
              r"""<script\b[^>]*src=["'][^"']+["'][^>]*>""",
              html,
              re.IGNORECASE,
          )
          for src in script_tags:
              if src.startswith(("https://", "http://")) and "iyakuza.github.io" not in src:
                  full_tag = next((tag for tag in full_script_tags if src in tag), "")
                  if not re.search(r"""\bintegrity=["']sha(256|384|512)-""", full_tag, re.IGNORECASE):
                      errors.append(f"Third-party script lacks SRI integrity: {src}")

          creator_path = Path("creator-posting.js")
          creator = creator_path.read_text(encoding="utf-8") if creator_path.exists() else ""
          if not creator:
              errors.append("Creator posting controller is missing.")
          if "/landing-page/cms/github-client.js" not in creator:
              errors.append("Creator controller must load the GitHub CMS client.")
          if "window.VHAGitHub.restoreSession()" not in creator:
              errors.append("Creator controller must restore the GitHub owner session.")
          if "@supabase/supabase-js" in creator.lower() or "supabase.createclient" in creator.lower():
              errors.append("Creator controller must not load or initialize Supabase.")

          runtime_paths = [
              "home.js",
              "green-dream/archive.js",
              "human-archive/archive.js",
              "creator-posting.js",
              "cms/github-client.js",
              "cms/github-store.js",
              "transmissions/posts.js",
              "index.html",
              "green-dream/index.html",
              "signals/index.html",
              "human-archive/index.html",
              "transmissions/index.html",
              "transmissions/the-awakening/index.html",
              "transmissions/the-descent/index.html",
              "transmissions/the-reconnection/index.html",
              "transmissions/the-transformation/index.html",
              "transmissions/the-return/index.html",
              "secure-your-soul/secure-your-soul.js",
              "secure-your-soul/index.html",
          ]
          runtime_patterns = [
              (re.compile(r"@supabase/supabase-js|supabase\.createClient|supabase\.from\(|supabase\.auth|supabase\.storage", re.IGNORECASE), "Supabase SDK/API"),
              (re.compile(r"https?://[^\s\"']*\.supabase\.co|wss?://[^\s\"']*\.supabase\.co", re.IGNORECASE), "Supabase endpoint"),
              (re.compile(r"(?:workers\.dev|cloudflareworkers\.com|r2\.dev|api\.cloudflare\.com)", re.IGNORECASE), "Cloudflare service endpoint"),
          ]
          for relative in runtime_paths:
              runtime_path = Path(relative)
              if not runtime_path.exists():
                  errors.append(f"Runtime dependency audit target is missing: {relative}")
                  continue
              runtime_source = runtime_path.read_text(encoding="utf-8")
              for pattern, label in runtime_patterns:
                  if pattern.search(runtime_source):
                      errors.append(f"{label} reference remains in runtime file: {relative}")

          archive_json_path = Path("content/human-archive.json")
          if not archive_json_path.exists():
              errors.append("Canonical Human Archive JSON is missing.")
          else:
              try:
                  archive_data = json.loads(archive_json_path.read_text(encoding="utf-8"))
                  media_manifest = archive_data.get("media_manifest", {})
                  media_items = media_manifest.get("items", [])
                  if not media_items:
                      errors.append("Human Archive media manifest is empty.")
                  for item in media_items:
                      if item.get("recovery_status") != "verified":
                          errors.append(f"Human Archive media is not verified: {item.get('id', 'unknown')}")
                          continue
                      local_path = item.get("local_path")
                      if not local_path or not Path(local_path).is_file():
                          errors.append(f"Verified Human Archive media file is missing: {local_path or item.get('id', 'unknown')}")
                  public_base = media_manifest.get("public_base_url", "")
                  if public_base:
                      for item in media_items:
                          storage_path = item.get("storage_path")
                          if storage_path and item.get("source_type") != "external-inline-reference":
                              legacy_url = public_base.rstrip("/") + "/" + storage_path.lstrip("/")
                              if legacy_url not in item.get("aliases", []):
                                  errors.append(f"Legacy media URL is not mapped to a local asset: {item.get('id', 'unknown')}")
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"Canonical Human Archive JSON or media manifest is invalid: {exc}")

          pending_media = 0
          for collection_path in ("content/transmissions.json", "content/signals.json"):
              try:
                  collection = json.loads(Path(collection_path).read_text(encoding="utf-8"))
                  for record in collection.get("records", []):
                      pending_media += sum(1 for item in record.get("media_items", []) if item.get("status") in ("pending_recovery", "pending"))
              except (OSError, json.JSONDecodeError):
                  errors.append(f"Could not inspect pending media in {collection_path}.")
          if pending_media:
              warnings.append(f"{pending_media} media item(s) remain pending local recovery and are intentionally not fetched from legacy storage.")


          security_path = Path(".well-known/security.txt")
          if not security_path.exists():
              errors.append(".well-known/security.txt is missing.")
          else:
              security_txt = security_path.read_text(encoding="utf-8")
              for field in ("Contact:", "Canonical:", "Policy:", "Expires:"):
                  if not re.search(r"^" + re.escape(field), security_txt, re.MULTILINE):
                      errors.append(f"security.txt is missing {field}")
              expiry = re.search(r"^Expires:\s*(.+)$", security_txt, re.MULTILINE)
              if expiry:
                  try:
                      expiry_date = datetime.fromisoformat(expiry.group(1).replace("Z", "+00:00"))
                      if expiry_date <= datetime.now(timezone.utc):
                          errors.append("security.txt Expires date is not in the future.")
                  except ValueError:
                      errors.append("security.txt Expires date is not valid ISO 8601.")

          robots_path = Path("robots.txt")
          if not robots_path.exists() or "Sitemap: https://iyakuza.github.io/landing-page/sitemap.xml" not in robots_path.read_text(encoding="utf-8"):
              errors.append("robots.txt must point to the published sitemap.")

          sitemap_path = Path("sitemap.xml")
          if not sitemap_path.exists():
              errors.append("sitemap.xml is missing.")
          else:
              try:
                  ET.parse(sitemap_path)
              except ET.ParseError as exc:
                  errors.append(f"sitemap.xml is not valid XML: {exc}")

          for warning in warnings:
              print(f"::warning::{warning}")
          for error in errors:
              print(f"::error::{error}")

          if errors:
              print(f"Security source checks failed: {len(errors)} error(s), {len(warnings)} warning(s).")
              sys.exit(1)

          print(f"Security source checks passed. Warnings: {len(warnings)}.")
          PY
