name: Static-site safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Validate owner-only recovery workflow and project helper syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/manage_recovery_pages_project.mjs
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/manual-recovery-preview.yml", aliases: true); puts "Manual recovery workflow YAML is valid."'

      - name: Prevent radio controls from regressing
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'gd-prev|gd-next|Previous station|Next station' index.html green-dream/index.html shared/crystal/tools/radio.js; then
            echo "Legacy Previous/Next radio controls must not return."
            exit 1
          fi
          # V/A Radio must remain a Crystal-controlled floating panel,
          # with content-sized dimensions and header-based pointer dragging.
          grep -Fq "radio.classList.add('vha-radio-floating')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('position','fixed','important')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('left','50%','important')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('bottom','calc(14px + 58px + 18px)','important')" shared/crystal/tools/radio.js
          grep -Fq "window.addEventListener('vha-radio-toggle'" shared/crystal/tools/radio.js
          grep -Fq "function setRadioHidden(hidden)" shared/crystal/tools/radio.js
          grep -Fq "document.body.appendChild(radio)" shared/crystal/tools/radio.js
          grep -Fq "head.addEventListener('pointerdown'" shared/crystal/tools/radio.js
          grep -Fq "head.addEventListener('pointermove'" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('resize','both','important')" shared/crystal/tools/radio.js
          # Constellation navigation is data-driven: route groups, draggable nodes,
          # persistent positions and ready events are the current public contract.
          grep -Fq 'constellationRoutes={' shared/crystal/tools/constellation.js
          grep -Fq 'constellationPositionKey="stars-v3-journey-tree"' shared/crystal/tools/constellation.js
          grep -Fq 'link.dataset.node=key' shared/crystal/tools/constellation.js
          grep -Fq 'document.dispatchEvent(new CustomEvent("vha-constellation-ready"' shared/crystal/tools/constellation.js
          grep -Fq 'map.vhaConstellation = { updateRoute:' shared/crystal/tools/constellation.js
          # Star Patterns must use the native dropdown, preserve visitor layouts,
          # and apply Ursa Major as the first-visit default.
          for pattern in orion ursa-major cassiopeia cygnus scorpius; do
            grep -Fq "\"$pattern\":" shared/crystal/tools/star-patterns.js
          done
          grep -Fq 'function applyPattern(patternName)' shared/crystal/tools/star-patterns.js
          grep -Fq 'select.addEventListener("change"' shared/crystal/tools/star-patterns.js
          grep -Fq 'applyPattern("ursa-major")' shared/crystal/tools/star-patterns.js
          grep -Fq 'saved.creator = { x: 88, y: 18 }' shared/crystal/tools/star-patterns.js

      - name: Check baseline browser security policy
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html green-dream/index.html cv/index.html cms/index.html; do
            grep -q 'Content-Security-Policy' "$page"
            if grep -Eq "script-src[^;]*unsafe-inline" "$page"; then
              echo "Inline script execution must not be allowed by the CSP in $page."
              exit 1
            fi
          done

      - name: Scan frontend source for obvious private-key markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|service_role[[:space:]]*[:=]' \
            --include='*.html' --include='*.js' .; then
            echo "Possible private credential marker found in public frontend source; review immediately."
            exit 1
          fi
          echo "No obvious private-key markers found in HTML/JavaScript source."
