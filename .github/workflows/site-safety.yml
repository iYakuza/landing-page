name: Static-site safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          node --test tests/*.test.js

      - name: Enforce shared Google Apps Script contact intake and paused Signal submissions
        shell: bash
        run: |
          set -euo pipefail
          # Homepage and CV retain the same shared form component.
          grep -Fq '/landing-page/shared/contact/contact.js?v=20261123-google-apps-script-1' index.html
          grep -Fq '/landing-page/shared/contact/contact.js?v=20261123-google-apps-script-1' cv/index.html
          grep -Fq "data-contact-context=\"website\"" index.html
          grep -Fq "data-contact-context=\"career\"" cv/index.html
          # The endpoint may be unconfigured (disabled) or a valid Google Apps Script deployment URL only.
          grep -Eq 'endpointUrl: ""|endpointUrl: "https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec"' shared/contact/contact.js
          grep -Fq 'function doPost(e)' google-apps-script/Code.gs
          grep -Fq 'MailApp.sendEmail' google-apps-script/Code.gs
          grep -Fq 'CONTACT_RECIPIENT' google-apps-script/Code.gs
          grep -Fq "form-action 'self' https://script.google.com https://script.googleusercontent.com" index.html
          grep -Fq "form-action 'self' https://script.google.com https://script.googleusercontent.com" cv/index.html
          grep -Fq "frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://script.google.com https://script.googleusercontent.com" index.html
          grep -Fq 'frame-src '\''self'\'' https://www.youtube-nocookie.com https://www.youtube.com https://script.google.com https://script.googleusercontent.com' cv/index.html
          # Public browser code must not contain recipient credentials, mail-client handoffs, or direct network calls.
          if grep -Eiq 'mailto:|fetch[[:space:]]*[(]|XMLHttpRequest' shared/contact/contact.js || grep -Fq 'stefancu.emanuel@gmail.com' shared/contact/contact.js google-apps-script/Code.gs; then
            echo "The public contact code must not expose the recipient address or use a mail-client/network handoff."
            exit 1
          fi
          grep -Fq 'GOOGLE SETUP REQUIRED' shared/contact/contact.js
          grep -Fq 'Online submission is not enabled yet. No information is sent or stored.' shared/contact/contact.js
          if grep -En 'cv-contact-dialog|CONTACT FORM TEMPORARILY DISCONNECTED|cv/contact.js' index.html cv/index.html; then
            echo "Legacy page-local contact dialogs or offline handlers must not return."
            exit 1
          fi
          grep -Fq 'id="cv-floating-nav"' cv/index.html
          grep -Fq 'window.parent.document' cv/navigation.js
          grep -Fq "new CustomEvent('vha-contact-open',{detail:{context:'subscription'}})" home.js
          grep -Fq 'COMMUNITY SUBMISSIONS ARE CURRENTLY PAUSED.' transmissions/posts.js
          grep -Fq "submissionForm.querySelectorAll('input,textarea,select').forEach(control=>{control.disabled=true;});" transmissions/posts.js
          grep -Fq 'submissionButton.disabled=true' transmissions/posts.js
          echo "Homepage and CV share one Google Apps Script contact form; viewer Signal submissions remain disabled."

      - name: Prevent radio controls from regressing
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'gd-prev|gd-next|Previous station|Next station' index.html green-dream/index.html shared/crystal/tools/radio.js; then
            echo "Legacy Previous/Next radio controls must not return."
            exit 1
          fi
          # V/A Radio must remain a Crystal-controlled floating panel,
          # with content-sized dimensions and header-based pointer dragging.
          grep -Fq "radio.classList.add('vha-radio-floating')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('position','fixed','important')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('left','50%','important')" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('bottom','calc(14px + 58px + 18px)','important')" shared/crystal/tools/radio.js
          grep -Fq "window.addEventListener('vha-radio-toggle'" shared/crystal/tools/radio.js
          grep -Fq "function setRadioHidden(hidden)" shared/crystal/tools/radio.js
          grep -Fq "document.body.appendChild(radio)" shared/crystal/tools/radio.js
          grep -Fq "head.addEventListener('pointerdown'" shared/crystal/tools/radio.js
          grep -Fq "head.addEventListener('pointermove'" shared/crystal/tools/radio.js
          grep -Fq "radio.style.setProperty('resize','both','important')" shared/crystal/tools/radio.js
          # Constellation navigation is data-driven: route groups, draggable nodes,
          # persistent positions and ready events are the current public contract.
          grep -Fq 'constellationRoutes={' shared/crystal/tools/constellation.js
          grep -Fq 'constellationPositionKey="stars-v3-journey-tree"' shared/crystal/tools/constellation.js
          grep -Fq 'link.dataset.node=key' shared/crystal/tools/constellation.js
          grep -Fq 'document.dispatchEvent(new CustomEvent("vha-constellation-ready"' shared/crystal/tools/constellation.js
          grep -Fq 'map.vhaConstellation = { updateRoute:' shared/crystal/tools/constellation.js
          # Crystal is the shared navigation source: reject retired page routes everywhere in its modules.
          if grep -RInE '/landing-page/(posts|community)(/|["])' shared/crystal; then
            echo "Crystal contains a retired Posts/Community route; use Transmissions/Signals instead."
            exit 1
          fi
          grep -Fq 'href="/landing-page/signals/"' shared/crystal/crystal.js
          grep -Fq '"/landing-page/transmissions/"' shared/crystal/tools/constellation.js
          grep -Fq '"/landing-page/signals/"' shared/crystal/tools/constellation.js
          grep -Fq '/landing-page/signals/' shared/crystal/tools/presentation.js
          grep -Fq 'crystal-loader.js?v=20261123-crystal-canonical-routes-1' game-ui.js
          grep -Fq 'const sharedVersion = "20261123-crystal-canonical-routes-1";' shared/crystal/crystal-loader.js
          for page in index.html transmissions/index.html signals/index.html transmissions/the-awakening/index.html transmissions/the-descent/index.html transmissions/the-reconnection/index.html transmissions/the-transformation/index.html transmissions/the-return/index.html green-dream/index.html human-archive/index.html cv/index.html secure-your-soul/index.html cms/index.html 404.html; do
            grep -Fq 'game-ui.js?v=20261123-crystal-canonical-routes-1' "$page"
          done
          for movement in the-awakening the-descent the-reconnection the-transformation the-return; do
            grep -Fq "/landing-page/transmissions/$movement/" shared/crystal/tools/constellation.js
            grep -Fq "/landing-page/transmissions/$movement/" shared/crystal/tools/presentation.js
          done
          # Transmissions shares Human Archive's archive-card skin and local record reader.
          grep -Fq '../human-archive/archive.css?v=20261122-responsive-card-video-1' transmissions/index.html
          grep -Fq 'archive-match.css?v=20261123-ha-archive-fidelity-1' transmissions/index.html
          grep -Fq 'data-vha-classes="ha-hero ha-ego-hero ha-transmissions-hero"' transmissions/index.html
          grep -Fq 'data-vha-kind="records" data-vha-classes="ha-records"' transmissions/index.html
          grep -Fq 'border:0!important' transmissions/archive-match.css
          grep -Fq '.ha-category-entries' human-archive/archive.css
          grep -Fq 'data-post-toggle=' transmissions/posts.js
          grep -Fq "const toggleButton=event.target.closest('[data-post-toggle]');" transmissions/posts.js
          grep -Fq 'ha-entry-body post-body' transmissions/posts.js
          # Star Patterns must use the native dropdown, preserve visitor layouts,
          # and apply Ursa Major as the first-visit default.
          for pattern in orion ursa-major cassiopeia cygnus scorpius; do
            grep -Fq "\"$pattern\":" shared/crystal/tools/star-patterns.js
          done
          grep -Fq 'function applyPattern(patternName)' shared/crystal/tools/star-patterns.js
          grep -Fq 'select.addEventListener("change"' shared/crystal/tools/star-patterns.js
          grep -Fq 'applyPattern("ursa-major")' shared/crystal/tools/star-patterns.js
          grep -Fq 'saved.creator = { x: 88, y: 18 }' shared/crystal/tools/star-patterns.js

      - name: Check baseline browser security policy
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html green-dream/index.html cv/index.html cms/index.html; do
            grep -q 'Content-Security-Policy' "$page"
            if grep -Eq "script-src[^;]*unsafe-inline" "$page"; then
              echo "Inline script execution must not be allowed by the CSP in $page."
              exit 1
            fi
          done

      - name: Scan frontend source for obvious private-key markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|service_role[[:space:]]*[:=]' \
            --include='*.html' --include='*.js' .; then
            echo "Possible private credential marker found in public frontend source; review immediately."
            exit 1
          fi
          echo "No obvious private-key markers found in HTML/JavaScript source."
